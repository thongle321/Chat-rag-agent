<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link href="/favicon.ico" rel="icon" type="image/svg+xml">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="#ffffff" name="theme-color">
    <link href="https://fonts.bunny.net" rel="preconnect">
    <link
      href="https://fonts.bunny.net/css?family=inter:400,500,600,700|space-grotesk:500,600,700"
      rel="stylesheet"
    >
    <title>VeilAi Rag</title>
    <meta
      content="AI-powered document chat with RAG — upload documents, ask questions, get sourced answers."
      name="description"
    >
    <style>
      html {
        background-color: #ffffff;
      }
      html.dark {
        background-color: #0f172a;
      }
    </style>
    <script>
      "use strict";
      (() => {
        const mode = localStorage.getItem("vueuse-color-scheme") || "auto";
        const dark =
          mode === "dark" ||
          (mode === "auto" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.classList.add("dark");
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#0f172a");
        }
      })();
    </script>
  </head>

  <body>
    <div class="isolate" id="app"></div>
    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
