[project]
name = "backend"
version = "0.1.0"
description = "RAG Chatbot Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.28.0",
    "liteparse>=2.9.0",
    "chromadb>=0.5.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=0.1.0",
    "chonkie>=0.1.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.23.0",
    "fastapi-users[sqlalchemy]>=13.0.0",
    "aiosqlite>=0.20.0",
    "symspellpy>=6.7.7",
    "underthesea>=6.8.4",
    "fastembed>=0.5.0",
    "pydantic-evals[logfire]>=0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
