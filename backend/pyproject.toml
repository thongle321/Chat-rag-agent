[project]
name = "backend"
version = "0.1.0"
description = "RAG Chatbot Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "httpx2>=2.12",
    "liteparse>=2.13.0",
    "chromadb>=1.5,<2",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.19,<3",
    "chonkie>=0.1.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.32",
    "fastapi-users[sqlalchemy]>=13.0.0",
    "pwdlib[argon2]",
    "aiosqlite>=0.20.0",
    "fastembed>=0.5.0",
    "logfire[fastapi,httpx,sqlalchemy]",
    "cryptography>=49.0.0",
    "bm25s>=0.3.10",
    "numpy>=2",
    "python-zalo-bot>=0.1.9",
    "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.BackgroundTasks",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.Cookie",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
