[project]
name = "backend"
version = "0.1.0"
description = "RAG Chatbot Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.28.0",
    "liteparse>=2.9.0",
    "chromadb>=0.5.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=0.1.0",
    "chonkie>=0.1.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.23.0",
    "fastapi-users[sqlalchemy]>=13.0.0",
    "pwdlib[argon2]",
    "aiosqlite>=0.20.0",
    "fastembed>=0.5.0",
    "logfire[fastapi,httpx,sqlalchemy]",
    "cryptography>=49.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
